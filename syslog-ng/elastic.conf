# /etc/syslog-ng/conf.d/elastic.conf — VICTIME
# Envoi des logs de sécurité vers Elasticsearch (hôte du lab, 192.168.122.1).
# S'AJOUTE à security.conf sans le modifier : la sortie security-collected.log
# lue par l'agent Wazuh reste intacte.
#
# Chaque ligne brute part dans le data stream de l'intégration Elastic
# correspondante ; le pipeline d'ingestion de l'intégration la convertit en ECS.
# Champs ajoutés :
#   - input.type=log      : aiguillage obligatoire du pipeline system.auth
#   - event.timezone      : les lignes syslog n'ont pas de fuseau, sinon décalage horaire
#   - host.name           : nom de la machine pour les vues Hosts d'Elastic Security
#   - host.id             : clé de corrélation attendue par les règles EQL d'Elastic
#   - host.os.type/family : champ filtré par les règles ES|QL d'Elastic (sinon "Unknown column")
# Ces champs host.* sont normalement posés par Elastic Agent ; syslog-ng doit les ajouter lui-même.

# --- Sources (persist-name distinct : les mêmes fichiers sont déjà lus par security.conf)
source s_es_auth          { file("/var/log/auth.log"           flags(no-parse) persist-name("es_auth")); };
source s_es_nginx_access  { file("/var/log/nginx/access.log"   flags(no-parse) persist-name("es_nginx_access")); };
source s_es_nginx_error   { file("/var/log/nginx/error.log"    flags(no-parse) persist-name("es_nginx_error")); };
source s_es_suricata      { file("/var/log/suricata/eve.json"  flags(no-parse) persist-name("es_suricata")); };

# --- Suricata : on écarte les compteurs internes (un événement "stats" toutes les 8 s, aucun intérêt sécurité)
filter f_es_no_stats { not message('"event_type":"stats"' type(string) flags(substring)); };

# --- Data stream cible de chaque source
rewrite r_es_auth          { set("logs-system.auth-default"   value("es_index")); };
rewrite r_es_nginx_access  { set("logs-nginx.access-default"  value("es_index")); };
rewrite r_es_nginx_error   { set("logs-nginx.error-default"   value("es_index")); };
rewrite r_es_suricata      { set("logs-suricata.eve-default"  value("es_index")); };

# --- Destination : API _bulk d'Elasticsearch, en TLS vérifié, par lots
destination d_elastic {
  http(
    url("https://192.168.122.1:9200/_bulk")
    method("POST")
    user("syslog-ng")
    password("REMPLACER_PAR_LE_MOT_DE_PASSE")  # réel hors dépôt ; déjà présent dans l'image de la victime
    headers("Content-Type: application/x-ndjson")
    body("{\"create\":{\"_index\":\"${es_index}\"}}\n$(format-json @timestamp=${ISODATE} message=${MESSAGE} input.type=log event.timezone=${TZOFFSET} host.name=${HOST} host.id=${HOST} host.os.type=linux host.os.family=debian)")
    body-suffix("\n")
    batch-lines(200)
    batch-timeout(2000)
    tls(
      ca-file("/etc/syslog-ng/elastic-ca.crt")
      peer-verify(yes)
    )
  );
};

# --- Chemins
log { source(s_es_auth);         rewrite(r_es_auth);         destination(d_elastic); };
log { source(s_es_nginx_access); rewrite(r_es_nginx_access); destination(d_elastic); };
log { source(s_es_nginx_error);  rewrite(r_es_nginx_error);  destination(d_elastic); };
log { source(s_es_suricata);     filter(f_es_no_stats); rewrite(r_es_suricata); destination(d_elastic); };
